<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhóm Toàn, Thịnh, Hoàng, Nguyễn Tuấn</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #89f7fe, #66a6ff);
      min-height: 400vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      transition: overflow 0.5s ease;
    }
    h1 {
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      margin-top: 40px;
    }
    .gallery {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      margin-top: 50px;
    }
    .card {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: translateY(-10px);
    }
    img {
      width: 200px;
      height: 200px;
      border-radius: 10px;
      object-fit: cover;
    }
    .bottom-section {
      margin-top: 150vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    video {
      width: 640px;
      height: 360px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    p {
      font-size: 18px;
      color: #333;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h1>Nhóm Toàn, Thịnh, Hoàng, Nguyễn Tuấn</h1>
  <div class="gallery">
    <div class="card">
      <img src="toan.jpg" alt="Toan">
      <p>Thầy Hòa đẹp trai cute phô mai que nhất thế giới</p>
    </div>
  </div>

  <div class="bottom-section">
    <video id="secretVideo" muted playsinline>
      <source src="video.mp4" type="video/mp4">
      Trình duyệt của bạn không hỗ trợ video.
    </video>
  </div>

  <script>
    const video = document.getElementById('secretVideo');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          video.play();
          document.body.style.overflow = 'hidden'; // khóa cuộn khi thấy video
        } else {
          video.pause();
        }
      });
    }, { threshold: 0.5 });

    observer.observe(video);

    // Mở lại cuộn khi video kết thúc
    video.addEventListener('ended', () => {
      document.body.style.overflow = 'auto';
    });
  </script>
</body>
</html>
