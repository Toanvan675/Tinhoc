<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chủ Đề F: Tạo Trang Web :3 UwU </title>

<style>
body{font-family:Arial;margin:0;text-align:center;background:linear-gradient(45deg,#89f7fe,#66a6ff);min-height:1000vh}
h1{color:#fff;text-shadow:2px 2px 4px #0004;margin-top:40px}
.names{color:#eef;font-weight:bold;margin-top:10px}
.card{background:#fff9;padding:20px;border-radius:15px;display:inline-block;box-shadow:0 8px 16px #0003;margin-top:50px}
img{width:200px;height:200px;border-radius:10px;object-fit:cover}
.scroll-hint{position:fixed;left:10px;top:50%;transform:rotate(-90deg);color:#fff;font-weight:bold;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}

.bottom{
  margin-top:400vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  padding-bottom:0;
}

video{width:640px;height:360px;border-radius:15px;box-shadow:0 8px 20px #0003;object-fit:fill}
</style>
</head>
<body>

<h1>Chủ Đề F: Tạo Trang Web :3 UwU </h1>

<div class="names">
  Nguyễn Văn Toàn • Nguyễn Phú Thịnh • Vũ Văn Hoàng • Nguyễn Minh Tuấn
</div>

<div class="card">
  <img src="toan.jpg" alt="Toan">
  <p>Thầy Hòa đẹp trai cute phô mai que nhất thế giới</p>
</div>

<div class="scroll-hint">cuộn xuống ↓</div>

<div class="bottom">
  <video id="v" playsinline controls>
    <source src="video.mp4" type="video/mp4">
  </video>
</div>

<script>
const v=document.getElementById('v');

function lockScroll(){
  document.body.style.overflow='hidden';
  window.scrollTo({top:v.offsetTop,behavior:"smooth"});
}

function unlockScroll(){
  document.body.style.overflow='auto';
}

const observer=new IntersectionObserver(e=>{
  e.forEach(ent=>{
    if(ent.isIntersecting){
      v.play().then(lockScroll).catch(()=>{});
    } else {
      v.pause();
    }
  });
},{threshold:0.6});

observer.observe(v);

v.addEventListener("play", lockScroll);

v.addEventListener("ended", unlockScroll);
</script>

</body>
</html>
